services:
  db:
    # When Docker Hub is unreachable, set UTOPIA_DB_IMAGE to any PG16+ image that includes pgvector.
    image: ${UTOPIA_DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: ${UTOPIA_DB_PASSWORD:-utopia}
      POSTGRES_DB: utopia
      # Password for the restricted runtime role. The init script creates the role only when this is set.
      # Without this, the application runs as the database owner.
      UTOPIA_APP_DB_PASSWORD: ${UTOPIA_APP_DB_PASSWORD:-}
    ports:
      # The host side avoids port 5432. A development machine often has a local Postgres already
      # using that port, and a conflict stops this container from starting. A person with a port
      # conflict also cannot use their own Postgres here, because it usually lacks pgvector.
      # The container still uses 5432 inside (the Postgres standard); the app connects to that
      # port over the compose network.
      #
      # This mapping binds to loopback only. It exists for local development, where a process
      # outside Docker (for example, a local server run) connects from the host. Binding to
      # 0.0.0.0 would expose a database with a default password to the public network.
      - "${UTOPIA_DB_BIND:-127.0.0.1:1517}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # This script creates the restricted role on first initialization only. For a deployment
      # where the data directory already exists, run the role creation step by hand (see the
      # upgrade notes in the README). Migration 0031 grants the role its permissions; this script does not.
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia -d utopia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full deployment: docker compose --profile app up -d
  # For local development, start only the db service, and run the application directly.
  #
  # This service sets image but not build. If both were set, `up` on a machine without the image
  # would build from source instead of pulling, and the prebuilt image would go unused. To build
  # from source, add docker-compose.build.yml as an extra compose file.
  app:
    # This pins a specific published version. **This default is the exact command the README promises.**
    # A tag that does not exist would fail with "manifest unknown" on the first run after a clone.
    # Update this value whenever a version is withdrawn. The 0.1.0 tag was withdrawn, so this now
    # points at a release candidate. Change it back to 0.1.0 once that version is stable, or to
    # `latest` to track the newest release automatically.
    image: ${UTOPIA_IMAGE:-ghcr.io/deeplethe/utopia:0.1.0-rc1}
    profiles: ["app"]
    environment:
      # By default, the application runs as the database owner. To use the restricted role
      # instead (full access to business tables, insert-and-read-only access to the ledger),
      # set both of the following values in .env. See .env.example. These values stay separate
      # instead of building one from the other, because a nested substitution here would be
      # hard to read and hard to debug when it fails.
      UTOPIA_DATABASE_URL: ${UTOPIA_DATABASE_URL:-postgres://utopia:${UTOPIA_DB_PASSWORD:-utopia}@db:5432/utopia}
      UTOPIA_MIGRATION_URL: ${UTOPIA_MIGRATION_URL:-}
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      # Leave this empty. Utopia generates one key on first start and stores it in deployment_settings.
      # A default value here would skip that step, and every deployment would then share one
      # publicly known key.
      UTOPIA_JWT_SECRET: ${UTOPIA_JWT_SECRET:-}
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      # Maximum size of the connection pool. The default is 32, matched to the default worker
      # concurrency. When the pool is smaller than the concurrency, requests slow down; no error
      # names the pool as the cause. Adjust this value together with worker concurrency.
      # Confirm that Postgres's own max_connections (default 100) can hold the new value first.
      UTOPIA_DB_MAX_CONNECTIONS: ${UTOPIA_DB_MAX_CONNECTIONS:-32}
    volumes:
      # Raw files (files/) and the full-text index (index/). Without this volume, a container
      # rebuild deletes these files while the documents rows in the database remain. Every
      # reference then points at a missing file, with no error. A backup needs this directory
      # and the database.
      - ./data:/app/data
    ports:
      - "1516:1516"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
