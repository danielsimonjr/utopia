# This file builds the image from source. Add it on top of docker-compose.yml when you changed
# the code, or when you want to run a version that has no published image yet:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile app up -d --build
#
# A normal deployment does not need this file. Run `docker compose --profile app up -d` instead
# to pull the prebuilt image.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
