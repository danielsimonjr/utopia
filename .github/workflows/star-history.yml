name: Star History

on:
  schedule:
    # This runs once a day. The star curve updated only once a week would show a flat
    # segment on the chart, and the chart exists to show the shape of growth.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  star-history:
    runs-on: ubuntu-latest
    # If the network hangs, the job must not run until GitHub's six-hour limit. Paging
    # through the API and rendering the chart takes under a minute in testing.
    timeout-minutes: 10
    steps:
      # The script `scripts/star-history.mjs` generates the chart. This no longer uses a
      # third-party action.
      #
      # This replaced `lowlighter/metrics` for two reasons. First, that action ties the
      # cumulative total and the daily new-stars count to the same toggle, with no way to
      # keep only the cumulative chart. The cumulative curve is the one this project wants.
      # Second, **that action is third-party code running under `contents: write`.**
      # Running our own script under that permission is safer.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the chart
        env:
          REPO: ${{ github.repository }}
          # **The default `GITHUB_TOKEN` is not enough here.** On 2026-06-30, GitHub
          # restricted the star timeline to repository admins and collaborators. This
          # secret holds a classic token; a fine-grained token cannot read this data.
          # Testing confirmed this token can fetch it. This keeps the name
          # `METRICS_TOKEN` to avoid changing the repository settings again.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          OUT: chart/star-history.svg
        run: node scripts/star-history.mjs

      # **This commits to a dedicated orphan branch and never touches the default branch.**
      # The `dev` branch has branch protection (a pull request is required, and
      # `enforce_admins: true` is set), so a direct bot push would always fail. Loosening
      # that protection just for a chart would defeat its purpose. The `assets` branch
      # shares no history with `dev`, so a commit there never touches any source code.
      - name: Commit to the assets branch
        run: |
          set -euo pipefail
          git clone --depth 1 --branch assets \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          mkdir -p out/assets
          # This saves two files: a white-line chart for the dark theme, and a
          # dark-line chart for the light theme. The README's `<picture>` element picks
          # one based on the active theme. A white line is invisible against GitHub's
          # light background, so both files are required.
          cp chart/star-history.svg chart/star-history-light.svg out/assets/
          cd out
          # This skips an empty commit on a day with no new stars. A daily "no change"
          # commit would flood this branch's history.
          if git diff --quiet -- assets/; then
            echo "chart unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Star history: $(date -u +%Y-%m-%d)"
          git push
