# This workflow publishes the container image to ghcr.io. Without it, the "one command" the
# README promises would really mean building the image from source on your own machine first.
name: Release

on:
  push:
    tags: ["v*"]
  # This lets a maintainer produce a deployable image before a formal tag exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0-rc1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # **A pre-release build must not move the latest tag.** metadata-action skips
            # pre-releases on its own for the {{version}} and {{major}}.{{minor}} patterns, but
            # not for this raw pattern. Pushing `v0.1.0-rc1` would move latest onto it, which is
            # the exact outcome a release candidate must avoid. The check looks for a hyphen in
            # the tag name, the mark semver uses for a pre-release.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # This step loads the image locally first, for the smoke test below. A successful build
      # does not prove the container can start; for example, a glibc version mismatch across
      # base images can pass the build and still crash the container on start.
      # This step targets amd64 only. An arm64 build would run under QEMU here, which would add
      # significant time to this job.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: utopia:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — boot it, migrate, register a user
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=utopia -e POSTGRES_PASSWORD=utopia -e POSTGRES_DB=utopia \
            pgvector/pgvector:pg16
          # Each poll condition below sits inside its own if statement. Under `set -e`, a bare
          # `cmd && break` would end the whole script the moment cmd fails once, turning "not
          # ready yet" into "build failed."
          for _ in $(seq 1 40); do
            if docker exec pg pg_isready -U utopia -d utopia >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # This run does not set UTOPIA_JWT_SECRET on purpose, so it tests the automatic
          # key generation path. The registration request below signs and returns a token,
          # so it fails if that key was never generated.
          docker run -d --name app --network smoke -p 1516:1516 \
            -e UTOPIA_DATABASE_URL=postgres://utopia:utopia@pg:5432/utopia \
            utopia:smoke

          # This step must call /api/v1/health and check the JSON body. The health route sits
          # under the /api/v1 prefix, and the image also serves the SPA as a fallback route.
          # A plain request to /health would return a 200 response with the index page, and
          # that could look like a passing check.
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf -m 3 http://localhost:1516/api/v1/health -o /tmp/h.json \
               && grep -q '"status":"ok"' /tmp/h.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::container never became healthy"; docker logs app; exit 1; fi

          # This registration call exercises the full chain: migrations, argon2 hashing, and JWT signing.
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' -m 10 \
            -X POST http://localhost:1516/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-password-123","display_name":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "::error::register returned $code"; cat /tmp/reg.json; docker logs app; exit 1
          fi
          grep -q '"token"' /tmp/reg.json || { echo "::error::no token issued"; cat /tmp/reg.json; exit 1; }
          echo "smoke test passed: healthy, migrated, user registered, token issued"

      # This step publishes the image only after the smoke test passes. The build cache is
      # already warm, so this step finishes almost immediately.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
