name: CI

on:
  push:
    branches: [main]
  pull_request:

# **This sets read-only access explicitly.** Without this block, the workflow inherits the
# repository default. The default is read-write, because the star-history workflow needs it.
# CI runs on every push and every pull request, so it must not inherit write access that
# another workflow needs for a different reason. This setting stays fixed here no matter how
# the repository default changes.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck
        run: bun run typecheck

  # A migration must run against a real database. Before this job existed, CI ran only
  # format, lint, test, and build. Two pull requests each added a migration numbered 0025.
  # Both passed CI on their own. After the merge, the server would not start, because the
  # migration runner indexes files by that number, and **no CI run ever tested the merged state.**
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: utopia
          POSTGRES_DB: utopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # A duplicate migration number is not a merge conflict at the file level. Git merges
      # two new files cleanly. This check is the only place that catches the duplicate.
      - name: Check for duplicate migration numbers
        run: |
          dupes=$(ls migrations/ | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration numbers: $dupes"
            ls migrations/
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run migrations on a fresh database
        run: bun run scripts/migrate.ts
        env:
          UTOPIA_MIGRATION_URL: postgres://utopia:utopia@localhost:5432/utopia
      # This second run must also pass. After a migration file changes its number, the
      # runner must still replay safely against a database that already ran the old number.
      - name: Run migrations a second time
        run: bun run scripts/migrate.ts
        env:
          UTOPIA_MIGRATION_URL: postgres://utopia:utopia@localhost:5432/utopia
      # Only this job can run the database-backed tests. The backend job has no database, so
      # those tests skip there and show green. Skipping this step would leave those tests
      # written but never executed, which is worse than not writing them: it lets a reader
      # believe the SQL has coverage that it does not have.
      - name: Test against the database
        run: bun test
        env:
          UTOPIA_DATABASE_URL: postgres://utopia:utopia@localhost:5432/utopia

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build (includes the type check)
        run: bun run --filter utopia-web build
